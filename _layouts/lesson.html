<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>{{ page.title }} · Shiqin Tong</title>
    <meta name="author" content="Shiqin Tong">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="{{ '/images/favicon.ico' | relative_url }}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="{{ '/stylesheet.css' | relative_url }}">
    <style>
      .lesson { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
      .lesson p { margin: 0 0 14px; line-height: 1.6; }
      .lesson .en { color: #555; }
      .lesson .gap { height: 14px; }
      .lesson h2 { margin: 28px 0 4px; }
      .lesson .date { color: #888; margin: 0 0 18px; }
      .lesson hr { border: 0; border-top: 1px solid #ddd; margin: 32px 0; }
      .lesson table { border-collapse: collapse; }
      .lesson td, .lesson th { padding: 4px 12px 4px 0; text-align: left; }
    </style>
  </head>
  <body>
    <div class="lesson">
      <p><a href="{{ '/#lessons' | relative_url }}">← Back to Lessons So Far</a></p>
      {{ content }}
    </div>
  </body>
</html>
